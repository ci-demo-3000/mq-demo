# Mirrors the current setup: separate deploy/e2e matrix jobs, e2e on always(), URL via job outputs.
name: before
on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.a.outputs.apps }}
      e2e: ${{ steps.a.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: a
        # apps = deployable projects; e2e = apps that have an <app>-e2e Playwright project
        run: |
          projects=$(.github/scripts/mock-nx-affected.sh)
          echo "apps=$(jq -c 'map(select(endswith("-e2e") | not))' <<< "$projects")" >> "$GITHUB_OUTPUT"
          echo "e2e=$(jq -c 'map(select(endswith("-e2e")) | rtrimstr("-e2e"))' <<< "$projects")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.analyze.outputs.apps) }}
    outputs:
      url: ${{ steps.d.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: echo "url=$(.github/scripts/mock-deploy.sh ${{ matrix.app }})" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [analyze, deploy]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.analyze.outputs.e2e) }}
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/mock-playwright.sh ${{ matrix.app }}
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}

  check-status:
    name: gate-before
    needs: [analyze, deploy, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure')
