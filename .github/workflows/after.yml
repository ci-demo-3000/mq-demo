# Proposed setup: per-PR concurrency in the queue, deploy+e2e in one job, gate fails on cancelled too.
name: after
on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.k.outputs.key }}
    steps:
      - id: k
        env:  # via env, never inline: head_ref is a user-controlled branch name on PRs
          REF: ${{ github.event.merge_group.head_ref || github.head_ref || github.run_id }}
        # gh-readonly-queue/<base>/pr-123-<sha> -> pr-123; PR branch names pass through unchanged
        run: echo "key=$(sed -E 's#.*/(pr-[0-9]+)-[0-9a-f]{40}$#\1#' <<< "$REF")" >> "$GITHUB_OUTPUT"

  analyze:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.a.outputs.apps }}
      e2e: ${{ steps.a.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: a
        # apps = deployable projects; e2e = apps that have an <app>-e2e Playwright project
        run: |
          projects=$(.github/scripts/mock-nx-affected.sh)
          echo "apps=$(jq -c 'map(select(endswith("-e2e") | not))' <<< "$projects")" >> "$GITHUB_OUTPUT"
          echo "e2e=$(jq -c 'map(select(endswith("-e2e")) | rtrimstr("-e2e"))' <<< "$projects")" >> "$GITHUB_OUTPUT"

  deploy-and-e2e:
    needs: [meta, analyze]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.analyze.outputs.apps) }}
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.app }}-${{ needs.meta.outputs.key }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        run: |
          url=$(.github/scripts/mock-deploy.sh ${{ matrix.app }})
          test -n "$url" || { echo "::error::no deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: contains(fromJson(needs.analyze.outputs.e2e), matrix.app)
        run: .github/scripts/mock-playwright.sh ${{ matrix.app }}
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}

  check-status:
    name: gate-after
    needs: [meta, analyze, deploy-and-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
